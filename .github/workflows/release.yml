name: Publish immutable package
on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Exact catalog package ID
        type: string
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    uses: MonkeysCodeAI/monkeyscode-plugins/.github/workflows/publish.yml@219483b4075c8afdc58e5d126b2ae8abe8d5ae21
    with:
      plugin: ${{ inputs.plugin }}
