name: Publish immutable package
on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Exact catalog package ID
        type: string
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    uses: MonkeysCodeAI/monkeyscode-plugins/.github/workflows/publish.yml@c1417e7c94d1f7e40f8bf7cfee51886b91918468
    with:
      plugin: ${{ inputs.plugin }}
