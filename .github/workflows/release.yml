name: Publish immutable package
on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Exact catalog package ID
        type: string
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    uses: MonkeysCodeAI/monkeyscode-plugins/.github/workflows/publish.yml@229f8d235bf7aed5e9459b15c1d72fe71b7f50bf
    with:
      plugin: ${{ inputs.plugin }}
